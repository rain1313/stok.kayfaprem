<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Form pendaftaran reseller Kayfa App Premium."><title>Daftar Reseller | Kayfa App Premium</title><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="daftar-reseller.css?v=1"></head><body>
<div class="glow glow-left"></div><div class="glow glow-right"></div><nav><div class="nav-container"><a href="/" class="brand"><img src="assets/logo.png" alt="Logo Kayfa App Premium"><span>Kayfa App Premium</span></a><a href="/join-reseller" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali</a></div></nav>
<main><section class="form-section"><div class="form-shell"><div class="form-intro"><span class="form-badge"><i class="fa-solid fa-user-plus"></i> PENDAFTARAN RESELLER</span><h1>Mulai bisnis digitalmu <span>sekarang.</span></h1><p>Lengkapi data di bawah ini. Admin Kayfa App Premium akan menghubungi kamu melalui WhatsApp.</p></div><div class="offer-strip"><div><small>BIAYA PENDAFTARAN</small><strong>Rp25.000</strong></div><span></span><div><small>BONUS</small><strong><i class="fa-solid fa-gift"></i> Canva Edu Lifetime</strong></div></div>
<form id="registrationForm" novalidate>
<div class="field"><label for="name">Nama Lengkap <b>*</b></label><div class="input-box"><i class="fa-solid fa-user"></i><input id="name" name="nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name" minlength="3" required></div><small></small></div>
<div class="field"><label for="whatsapp">Nomor WhatsApp <b>*</b></label><div class="input-box"><i class="fa-brands fa-whatsapp"></i><input id="whatsapp" name="whatsapp" type="tel" placeholder="Contoh: 081234567890" autocomplete="tel" inputmode="numeric" required></div><small></small></div>
<div class="field"><label for="email">Email <b>*</b></label><div class="input-box"><i class="fa-solid fa-envelope"></i><input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required></div><small></small></div>
<div class="field"><label for="city">Kota / Kabupaten <b>*</b></label><div class="input-box"><i class="fa-solid fa-location-dot"></i><input id="city" name="kota" type="text" placeholder="Contoh: Jakarta" autocomplete="address-level2" minlength="2" required></div><small></small></div>
<div class="field"><label for="referral">Kode Referral <em>(Opsional)</em></label><div class="input-box"><i class="fa-solid fa-ticket"></i><input id="referral" name="kode_referral" type="text" placeholder="Masukkan kode referral jika ada" maxlength="30"></div><small></small></div>
<div class="honeypot" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><button id="submitButton" type="submit"><span>Daftar Sekarang</span><i class="fa-solid fa-arrow-right"></i></button><div id="formStatus" class="form-status" role="status" aria-live="polite"></div><p class="privacy"><i class="fa-solid fa-lock"></i> Data kamu akan diproses dengan aman.</p></form></div></section></main><script src="daftar-reseller.js?v=1"></script></body></html>
